name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run -- --maxWorkers=4
      - run: npm run build
      - run: npx playwright install chromium
      # Isolate map rendering and image processing on each runner.
      - run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
